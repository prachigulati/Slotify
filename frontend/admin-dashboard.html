<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Slotify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Slot<span>ify</span> <span style="font-size: 12px; color: #64748b; font-weight: normal;">| Admin Suite</span></a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span id="adminNameDisplay" style="font-size: 14px; color: #475569;"></span>
            <button onclick="logout()" class="btn btn-outline" style="padding: 6px 14px; font-size: 13px;">Log Out</button>
        </div>
    </header>

    <main class="admin-overview">
        <div class="section-header">
            <h2>Facility Management Overview</h2>
            <p>Real-time occupancy metrics and system analytics.</p>
        </div>
        
        <div class="grid-3" style="margin-bottom: 40px;">
            <div class="admin-stat">
                <h3>Total Capacity</h3>
                <p>120 Slots</p>
            </div>
            <div class="admin-stat">
                <h3>Current Occupancy</h3>
                <p>84% Filled</p>
            </div>
            <div class="admin-stat">
                <h3>Active Disputes</h3>
                <p>0 Unresolved</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Slotify Systems. All rights reserved.</p>
        <p>Smart Parking Management Platform</p>
    </footer>

    <script src="script.js"></script>
    <script>
        checkAuth('admin');
        document.getElementById('adminNameDisplay').innerText = 'Admin: ' + getCurrentUser().name;
    </script>
</body>
</html>
