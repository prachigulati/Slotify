<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Slotify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <a href="index.html" class="logo"
           style="display: block; text-align: center; margin-bottom: 25px;">
            Slot<span>ify</span>
        </a>

        <h2>Create an account</h2>
        <p class="auth-sub">Enter your details to register on Slotify.</p>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    required
                    placeholder="Your full name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    required
                    placeholder="you@example.com"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    required
                    minlength="6"
                    placeholder="At least 6 characters"
                >
            </div>

            <p
                id="error-msg"
                style="color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none;"
            ></p>

            <button
                type="submit"
                id="signupButton"
                class="btn"
                style="width: 100%; justify-content: center;"
            >
                Sign Up
            </button>
        </form>

        <div class="auth-footer-text">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
