<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Slotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="logo">Slot<span>ify</span> <span style="font-size: 12px; color: #38bdf8; font-weight: normal;">| Admin Suite</span></a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span id="adminNameDisplay" style="font-size: 14px; color: #9ca3af;"></span>
            <button onclick="logout()" class="btn btn-outline" style="padding: 6px 14px; font-size: 13px;">Log Out</button>
        </div>
    </header>

    <section style="padding-top: 140px;">
        <div class="section-header">
            <h2>Facility Management Overview</h2>
            <p>Real-time occupancy metrics and system analytics.</p>
        </div>
        
        <div class="grid-3" style="margin-bottom: 40px;">
            <div class="card">
                <h3>Total Capacity</h3>
                <p style="font-size: 24px; font-weight: bold; color: #f3f4f6; margin-top: 5px;">120 Slots</p>
            </div>
            <div class="card">
                <h3>Current Occupancy</h3>
                <p style="font-size: 24px; font-weight: bold; color: #38bdf8; margin-top: 5px;">84% Filled</p>
            </div>
            <div class="card">
                <h3>Active Disputes</h3>
                <p style="font-size: 24px; font-weight: bold; color: #22c55e; margin-top: 5px;">0 Unresolved</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Slotify Systems. All rights reserved.</p>
        <p>Smart Parking Management Platform</p>
    </footer>

    <script src="script.js"></script>
    <script>
        checkAuth('admin');
        document.getElementById('adminNameDisplay').innerText = 'Admin: ' + getCurrentUser().name;
    </script>
</body>
</html>
