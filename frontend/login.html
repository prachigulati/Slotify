<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Slotify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <a href="index.html" class="logo"
           style="display: block; text-align: center; margin-bottom: 25px;">
            Slot<span>ify</span>
        </a>

        <h2>Welcome back</h2>
        <p class="auth-sub">Please enter your credentials to access your portal.</p>

        <form id="loginForm"onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    required
                    placeholder="user@gmail.com"
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="Your password"
                >
            </div>

            <p
                id="error-msg"
                style="color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none;"
            ></p>

            <button
                type="submit"
                id="loginButton"
                class="btn"
                style="width: 100%; justify-content: center;"
            >
                Log In
            </button>
        </form>

        <div class="auth-footer-text">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
